<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Manage Phone Numbers</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
    h2 { color: #d93025; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 15px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 6px; font-size: 14px; }
    .btn { width: 100%; background: #d93025; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn:hover { background: #b31d13; }
    .list-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px; margin-top: 8px; border-radius: 6px; border: 1px solid #eee; }
    .del-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚙️ Admin Control Panel</h2>

    <div class="form-group">
      <label>Admin Password</label>
      <input type="password" id="adminPass" value="admin123" placeholder="Enter Admin Password">
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <h3>➕ ဖုန်းနံပါတ် အသစ်ထည့်ရန်</h3>
    <div class="form-group">
      <label>နိုင်ငံ ရွေးပါ</label>
      <select id="addCountry">
        <option value="MM">🇲🇲 Myanmar (+95)</option>
        <option value="US">🇺🇸 United States (+1)</option>
      </select>
    </div>
    <div class="form-group">
      <label>ဖုန်းနံပါတ် (Phone Number)</label>
      <input type="text" id="addPhone" placeholder="e.g. +959123456789 or +1234567890">
    </div>
    <button class="btn" onclick="addNumber()">နံပါတ် တင်မည်</button>

    <h3 style="margin-top: 30px;">📋 တင်ထားသော နံပါတ်များ</h3>
    <div id="numberList">Loading...</div>
  </div>

  <script>
    async function loadNumbers() {
      const res = await fetch('/api/admin/numbers');
      const data = await res.json();
      const listDiv = document.getElementById('numberList');
      listDiv.innerHTML = '';

      ['MM', 'US'].forEach(country => {
        const title = country === 'MM' ? '🇲🇲 Myanmar' : '🇺🇸 United States';
        listDiv.innerHTML += `<h4>${title}</h4>`;
        
        if (!data[country] || data[country].length === 0) {
          listDiv.innerHTML += `<p style="color:#888; font-size:13px;">နံပါတ် မရှိသေးပါ။</p>`;
        } else {
          data[country].forEach(item => {
            listDiv.innerHTML += `
              <div class="list-item">
                <span><b>${item.phone}</b></span>
                <button class="del-btn" onclick="deleteNumber('${country}', ${item.id})">Delete</button>
              </div>
            `;
          });
        }
      });
    }

    async function addNumber() {
      const passkey = document.getElementById('adminPass').value;
      const country = document.getElementById('addCountry').value;
      const phone = document.getElementById('addPhone').value;

      const res = await fetch('/api/admin/add-number', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ passkey, country, phone })
      });
      const data = await res.json();
      alert(data.message);
      if(data.success) {
        document.getElementById('addPhone').value = '';
        loadNumbers();
      }
    }

    async function deleteNumber(country, id) {
      const passkey = document.getElementById('adminPass').value;
      const res = await fetch(`/api/admin/delete-number/${country}/${id}`, {
        method: 'DELETE',
        headers: { 'x-passkey': passkey }
      });
      const data = await res.json();
      alert(data.message);
      if(data.success) loadNumbers();
    }

    loadNumbers();
  </script>

</body>
</html>
